name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # puppeteer-core doesn't download a browser, so install is cheap.
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Audio definitions check (SFX / music validation)
        run: npx tsx tools/audio_check.ts --fast --no-wav
      - name: Build
        run: npm run build
